<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beko Professional – Fiches Produits</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', sans-serif; }
  .hero { background: radial-gradient(circle at 85% 20%, rgba(0,153,255,.35), transparent 45%),
                      linear-gradient(135deg, #001a3d 0%, #00306e 55%, #0057b8 100%); }
  .logo-white { filter: brightness(0) invert(1); }
  .card { transition: transform .25s ease, box-shadow .25s ease; }
  .card:hover { transform: translateY(-6px); box-shadow: 0 24px 50px rgba(0,40,90,.15); }
  .card:hover .zoom { transform: scale(1.06); }
  .zoom { transition: transform .4s ease; }
  .loader { width:40px;height:40px;border:3px solid #dbe4f0;border-top-color:#0057b8;border-radius:50%;animation:spin .8s linear infinite }
  @keyframes spin { to { transform: rotate(360deg); } }
  .fade { animation: fade .35s ease both; }
  @keyframes fade { from { opacity:0; transform:translateY(8px);} to {opacity:1; transform:none;} }
</style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-900">

<!-- EN-TÊTE -->
<header class="hero text-white">
  <div class="max-w-7xl mx-auto px-5 sm:px-8 pt-8 pb-16">
    <div class="flex items-center justify-between">
      <a href="#" id="logo-zone" class="flex items-center gap-3"></a>
      <span class="hidden sm:inline text-xs uppercase tracking-[.2em] text-blue-200">Espace professionnels</span>
    </div>
    <div class="mt-10 max-w-3xl">
      <p class="text-xs font-bold uppercase tracking-[.25em] text-sky-300 mb-4">Médiathèque produits</p>
      <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight">Fiches Produits</h1>
      <p class="mt-4 text-lg text-blue-100/90">Toute la gamme Beko Professional : buanderie, cuisson, froid et laverie.</p>
    </div>
    <div class="mt-8 max-w-2xl relative">
      <svg class="w-5 h-5 text-slate-400 absolute left-4 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-width="2" d="m21 21-4.35-4.35m2.1-5.4a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0z"/></svg>
      <input id="search" type="text" placeholder="Rechercher une référence, un modèle ou un code EAN..."
        class="w-full pl-12 pr-5 py-4 rounded-2xl bg-white text-slate-900 placeholder-slate-400 shadow-2xl outline-none focus:ring-4 focus:ring-sky-400/40">
    </div>
  </div>
</header>

<!-- CONTENU -->
<main class="max-w-7xl mx-auto px-5 sm:px-8 -mt-8 pb-16">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 px-5 py-4 mb-8 flex flex-wrap items-center justify-between gap-3">
    <nav id="breadcrumb" class="flex flex-wrap items-center gap-2 text-sm font-medium"></nav>
    <span id="count" class="text-sm text-slate-500"></span>
  </div>

  <div id="loading" class="flex flex-col items-center py-24">
    <div class="loader"></div>
    <p class="mt-4 text-sm text-slate-500">Chargement de la médiathèque...</p>
  </div>
  <div id="error" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-2xl p-6 text-center"></div>
  <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>
  <div id="product" class="hidden"></div>
  <div id="empty" class="hidden text-center py-20 text-slate-500">Aucun document trouvé.</div>
</main>

<footer class="bg-[#001a3d] text-blue-200/70 text-sm">
  <div class="max-w-7xl mx-auto px-5 sm:px-8 py-6 flex justify-between">
    <span>© Beko Professional France</span><span>Médiathèque Fiches Produits</span>
  </div>
</footer>

<script>
/* ====== PARAMÈTRES ====== */
const CONFIG = {
  owner: "BekoFranceCC",
  repo: "Bekopro",
  imagesFolder: "Images Beko Pro",
  logo: "Images Beko Pro/logo-beko-pro.png"
};
const ICONS = { BUANDERIE:"🧺", CUISSON:"🔥", FROID:"❄️", LAVERIE:"🍽️" };
const IMG_EXT = ["jpg","jpeg","png","webp","gif"];

let tree = [], branch = "main", photos = {};
const $ = id => document.getElementById(id);

/* ====== OUTILS ====== */
const ext   = n => n.includes(".") ? n.split(".").pop().toLowerCase() : "";
const base  = p => p.split("/").pop();
const clean = n => n.replace(/\.[^/.]+$/, "");
const norm  = n => clean(n).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Z0-9]/g,"");
const url   = p => p.split("/").map(encodeURIComponent).join("/");     // lien relatif (GitHub Pages)
const esc   = t => { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; };
const isHidden = p => p.split("/").some(s => s.startsWith(".")) || p === "index.html";
const inImages = p => p === CONFIG.imagesFolder || p.startsWith(CONFIG.imagesFolder + "/");
const isDoc = i => i.type === "blob" && !inImages(i.path) && !IMG_EXT.includes(ext(i.path));

/* ====== LECTURE DU NOM DE FICHE ======
   ex : "Fiche produit_LL_Beko Pro_ALA021BP_853202101000.pdf"
   -> marque "Beko Pro", modèle "ALA021BP", code "853202101000" */
function parseName(fileName) {
  const parts = clean(fileName).split("_").map(s => s.trim()).filter(Boolean);
  const idx = parts.findIndex(s => /^\d{8,}$/.test(s));
  const code = idx >= 0 ? parts[idx] : (clean(fileName).match(/\d{8,}/) || [""])[0];
  let model = clean(fileName), brand = "";
  if (idx > 0) {
    model = parts[idx - 1];
    brand = idx > 1 ? parts[idx - 2] : "";
    if (/^fiche/i.test(brand) || brand.length <= 3) brand = "";
  }
  return { model, brand, code };
}

/* ====== PHOTO D'UNE FICHE ======
   Cherche dans "Images Beko Pro" une photo dont le nom contient :
   1) le code produit (ex. 853202101000)  2) sinon le modèle (ex. ALA021BP)
   Fonctionne aussi avec des sous-dossiers et des noms comme "ALA021BP_face.jpg" */
const photoCache = {};
function photoFor(fileName) {
  if (fileName in photoCache) return photoCache[fileName];
  const { code, model } = parseName(fileName);
  const keys = Object.keys(photos);
  const c = norm(code || ""), m = norm(model || "");
  let k = null;
  if (c.length >= 8) {
    k = photos[c] ? c
      : keys.find(p => p.startsWith(c) || p.includes(c))
      || keys.find(p => /^\d{8,}/.test(p) && c.startsWith(p.match(/^\d+/)[0]));
  }
  if (!k && m.length >= 4) {
    k = photos[m] ? m : keys.find(p => p.startsWith(m)) || keys.find(p => p.includes(m))
      // modèle avec suffixe différent (ex. fiche "ALA021BP" / photo "ALA021")
      || keys.find(p => p.length >= 5 && /\d/.test(p) && m.startsWith(p));
  }
  return (photoCache[fileName] = k ? photos[k] : null);
}


/* ====== GALERIE MULTI-PHOTOS ======
   Fichiers attendus dans Images Beko Pro :
   12NC.jpg, 12NC_2.jpg, 12NC_3.jpg, ...
*/
function galleryFor(fileName) {
  const { code } = parseName(fileName);
  const c = (code || "").replace(/\D/g, "");
  if (c.length !== 12) {
    const main = photoFor(fileName);
    return main ? [main] : [];
  }

  const found = [];
  Object.entries(photos).forEach(([key, value]) => {
    // norm("859991718500_2.jpg") => "8599917185002"
    if (key === c) found.push({ n: 1, url: value });
    else if (key.startsWith(c)) {
      const suffix = key.slice(c.length);
      if (/^\d+$/.test(suffix)) {
        const n = Number(suffix);
        if (n >= 2) found.push({ n, url: value });
      }
    }
  });

  // Si la photo principale a été trouvée via l'ancien mécanisme, on la garde aussi.
  const main = photoFor(fileName);
  if (main && !found.some(p => p.url === main)) found.push({ n: 1, url: main });

  return [...new Map(found.sort((a,b) => a.n-b.n).map(p => [p.url, p.url])).values()];
}

/* ====== DIAGNOSTIC : ajouter #diagnostic à la fin de l'adresse ====== */
function renderDiagnostic() {
  const docs = tree.filter(isDoc);
  const missing = docs.filter(d => !photoFor(base(d.path)));
  const used = new Set(docs.map(d => photoFor(base(d.path))).filter(Boolean));
  const unused = Object.entries(photos).filter(([, u]) => !used.has(u)).map(([, u]) => decodeURIComponent(u));
  $("loading").classList.add("hidden");
  $("empty").classList.add("hidden");
  $("breadcrumb").innerHTML = `<a href="#" class="text-[#0057b8] hover:underline">🏠 Accueil</a><span class="text-slate-300">/</span><b>Diagnostic photos</b>`;
  $("count").textContent = `${docs.length - missing.length} / ${docs.length} fiches avec photo`;
  const row = (t, sub) => `<li class="py-1.5 border-b border-slate-100"><span class="font-medium">${esc(t)}</span>${sub ? `<br><span class="text-xs text-slate-400">${esc(sub)}</span>` : ""}</li>`;
  $("grid").innerHTML = `
    <div class="sm:col-span-2 bg-white rounded-2xl border border-slate-200 p-5">
      <h3 class="font-bold text-red-600 mb-3">Fiches sans photo (${missing.length})</h3>
      <ul class="text-sm">${missing.map(d => { const { model, code } = parseName(base(d.path));
        return row(base(d.path), `Nommer la photo : ${code || model}.jpg`); }).join("") || "<li>Aucune 🎉</li>"}</ul>
    </div>
    <div class="sm:col-span-2 bg-white rounded-2xl border border-slate-200 p-5">
      <h3 class="font-bold text-amber-600 mb-3">Photos non reliées à une fiche (${unused.length})</h3>
      <ul class="text-sm">${unused.map(u => row(u)).join("") || "<li>Aucune</li>"}</ul>
    </div>`;
}

function folderPhoto(path) {
  const own = photos[norm(base(path))];
  if (own) return own;
  const doc = tree.find(i => isDoc(i) && i.path.startsWith(path + "/") && photoFor(base(i.path)));
  return doc ? photoFor(base(doc.path)) : null;
}
const countDocs = path => tree.filter(i => isDoc(i) && i.path.startsWith(path + "/")).length;

/* ====== CHARGEMENT DU DÉPÔT ====== */
async function loadTree() {
  const cached = sessionStorage.getItem("bekopro-tree");
  if (cached) { ({ tree, branch } = JSON.parse(cached)); return; }
  const r = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}`);
  if (!r.ok) throw new Error("Dépôt GitHub inaccessible (limite d'appels atteinte ? réessayez dans quelques minutes).");
  branch = (await r.json()).default_branch;
  const res = await fetch(`https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/git/trees/${branch}?recursive=1`);
  if (!res.ok) throw new Error("Impossible de lire l'arborescence.");
  tree = (await res.json()).tree.filter(i => !isHidden(i.path));
  sessionStorage.setItem("bekopro-tree", JSON.stringify({ tree, branch }));
}

/* ====== LOGO ====== */
function renderLogo() {
  const exists = tree.some(i => i.path === CONFIG.logo);
  $("logo-zone").innerHTML = exists
    ? `<img src="${url(CONFIG.logo)}?v=${Date.now()}" alt="Beko Professional" class="logo-white h-16 md:h-20 w-auto">`
    : `<span class="text-3xl font-extrabold tracking-tight">beko</span><span class="h-7 w-px bg-white/40"></span>
       <span class="text-sm font-semibold tracking-[.25em] text-sky-200">PROFESSIONAL</span>`;
}

/* ====== LISTES ====== */
function children(path) {
  const depth = path ? path.split("/").length + 1 : 1;
  return tree.filter(i => i.path.split("/").length === depth &&
      (path ? i.path.startsWith(path + "/") : true) && !inImages(i.path) &&
      (i.type === "tree" || isDoc(i)))
    .sort((a, b) => a.type !== b.type ? (a.type === "tree" ? -1 : 1)
                    : base(a.path).localeCompare(base(b.path), "fr", { numeric: true }));
}

function folderCard(item, i) {
  const name = base(item.path), img = folderPhoto(item.path), n = countDocs(item.path);
  const root = item.path.split("/")[0].toUpperCase();
  return `
  <a href="#${encodeURIComponent(item.path)}" class="card fade bg-white rounded-3xl overflow-hidden border border-slate-200 group block" style="animation-delay:${i*40}ms">
    <div class="h-48 bg-gradient-to-br from-slate-50 to-blue-50 flex items-center justify-center overflow-hidden relative p-4">
      ${img ? `<img src="${img}" loading="lazy" class="zoom max-h-40 object-contain mix-blend-multiply" alt="">`
            : `<span class="zoom text-6xl">${ICONS[root] || "📁"}</span>`}
      <span class="absolute top-3 right-3 bg-white/90 text-[#00306e] text-xs font-bold px-3 py-1 rounded-full shadow">${n} fiche${n>1?"s":""}</span>
    </div>
    <div class="p-5 border-t border-slate-100">
      <p class="text-[11px] font-bold uppercase tracking-widest text-sky-600">Catégorie</p>
      <h3 class="mt-1 text-lg font-bold text-slate-900">${esc(name)}</h3>
      <p class="mt-4 text-sm font-semibold text-[#0057b8] flex items-center gap-2">Découvrir <span class="transition group-hover:translate-x-1">→</span></p>
    </div>
  </a>`;
}

function productCard(item, i, showPath) {
  const name = base(item.path), gallery = galleryFor(name), img = gallery[0] || photoFor(name), { model, brand, code } = parseName(name);
  const parent = item.path.split("/").slice(0, -1).join(" › ");
  return `
  <a href="#produit=${encodeURIComponent(item.path)}" class="card fade bg-white rounded-3xl overflow-hidden border border-slate-200 group flex flex-col" style="animation-delay:${i*40}ms">
    <div class="h-60 bg-white flex items-center justify-center overflow-hidden p-6 relative">
      ${img ? `<img src="${img}" loading="lazy" class="zoom max-h-full object-contain" alt="${esc(model)}">`
            : `<div class="w-20 h-24 rounded-xl bg-red-50 text-red-500 flex items-center justify-center font-extrabold">PDF</div>`}
           ${gallery.length > 1 ? `<span class="absolute top-3 right-3 bg-white/95 text-[#00306e] text-[11px] font-bold px-2.5 py-1 rounded-full shadow">📷 ${gallery.length}</span>` : ""}
    </div>
    <div class="p-5 border-t border-slate-100 flex flex-col flex-1">
      <p class="text-[11px] ${showPath ? "text-slate-400" : "font-bold uppercase tracking-widest text-sky-600"}">${showPath ? esc(parent) : "Fiche produit"}</p>
      <h3 class="mt-1 text-lg font-bold text-slate-900 break-words">${esc(model)}</h3>
      ${code ? `<p class="text-xs text-slate-400 mt-1">Code : ${esc(code)}</p>` : ""}
      <span class="mt-auto pt-4 inline-flex items-center justify-center gap-2 w-full rounded-xl bg-[#0057b8] group-hover:bg-[#00306e] text-white text-sm font-semibold py-2.5 transition">
        Voir le produit →
      </span>
    </div>
  </a>`;
}

function renderGrid(items, showPath = false) {
  $("loading").classList.add("hidden");
  $("product").classList.add("hidden");
  $("grid").classList.remove("hidden");
  $("empty").classList.toggle("hidden", items.length > 0);
  $("grid").innerHTML = items.map((it, i) => it.type === "tree" ? folderCard(it, i) : productCard(it, i, showPath)).join("");
  $("count").textContent = `${items.length} élément${items.length > 1 ? "s" : ""}`;
}

/* ====== PAGE PRODUIT ====== */
function renderProduct(path) {
  const item = tree.find(i => i.path === path);
  if (!item) { location.hash = ""; return; }
  const name = base(path), gallery = galleryFor(name), img = gallery[0] || photoFor(name), { model, brand, code } = parseName(name);
  activeGallery = gallery;
  const folder = path.split("/").slice(0, -1);
  const pdf = url(path);
  const isPdf = ext(name) === "pdf";

  breadcrumb(folder.join("/"), model);
  $("count").textContent = "";
  $("loading").classList.add("hidden");
  $("grid").classList.add("hidden");
  $("empty").classList.add("hidden");
  $("product").classList.remove("hidden");
  $("product").innerHTML = `
  <div class="fade bg-white rounded-3xl border border-slate-200 overflow-hidden">
    <div class="grid lg:grid-cols-2">
      <div class="bg-gradient-to-br from-slate-50 to-blue-50 flex items-center justify-center p-10 min-h-[360px]">
        ${img ? `<img id="product-main-image" src="${img}" class="max-h-[420px] object-contain mix-blend-multiply" alt="${esc(model)}">`
              : `<div class="text-center text-slate-400"><div class="text-6xl mb-3">📷</div>Photo non disponible</div>`}
      </div>
      ${gallery.length > 1 ? `<div class="px-8 pb-8 flex flex-wrap gap-3 justify-center">${gallery.map((photo, index) => `<button type="button" onclick="selectGalleryPhoto(${index})" class="gallery-thumb ${index === 0 ? "ring-2 ring-[#0057b8]" : ""} w-20 h-20 rounded-xl border border-slate-200 bg-white p-1.5"><img src="${photo}" class="w-full h-full object-contain" alt="Photo ${index + 1}"></button>`).join("")}</div>` : ""}
      <div class="p-8 md:p-10 flex flex-col">
        <p class="text-xs font-bold uppercase tracking-[.2em] text-sky-600">${esc(folder.join(" › "))}</p>
        <h2 class="mt-3 text-3xl md:text-4xl font-extrabold text-slate-900 break-words">${esc(model)}</h2>
        <dl class="mt-6 grid grid-cols-2 gap-4">
         ${code ? `<div class="bg-slate-50 rounded-xl p-4"><dt class="text-xs text-slate-400 uppercase">Code / EAN</dt><dd class="font-semibold mt-1">${esc(code)}</dd></div>` : ""}
          <div class="bg-slate-50 rounded-xl p-4"><dt class="text-xs text-slate-400 uppercase">Gamme</dt><dd class="font-semibold mt-1">${esc(folder[folder.length-1] || "")}</dd></div>
          <div class="bg-slate-50 rounded-xl p-4"><dt class="text-xs text-slate-400 uppercase">Document</dt><dd class="font-semibold mt-1">${ext(name).toUpperCase()}</dd></div>
        </dl>
        <div class="mt-8 flex flex-col sm:flex-row gap-3">
          <a href="${pdf}" target="_blank" rel="noopener" class="flex-1 text-center rounded-xl bg-[#0057b8] hover:bg-[#00306e] text-white font-semibold py-3 transition">Ouvrir la fiche ↗</a>
          <a href="${pdf}" download class="flex-1 text-center rounded-xl border border-slate-300 hover:bg-slate-50 font-semibold py-3 transition">Télécharger</a>
          ${img ? `<a href="${img}" download class="flex-1 text-center rounded-xl border border-slate-300 hover:bg-slate-50 font-semibold py-3 transition">Photo HD</a>` : ""}
        </div>
        <a href="#${encodeURIComponent(folder.join("/"))}" class="mt-6 text-sm font-semibold text-[#0057b8] hover:underline">← Retour à ${esc(folder[folder.length-1] || "l'accueil")}</a>
      </div>
    </div>
    ${isPdf ? `<div class="border-t border-slate-200 bg-slate-50 p-4 md:p-6">
      <iframe src="${pdf}#view=FitH" class="w-full h-[80vh] rounded-xl border border-slate-200 bg-white" title="Fiche ${esc(model)}"></iframe>
    </div>` : ""}
  </div>`;
}


let activeGallery = [];
function selectGalleryPhoto(index) {
  const img = $("product-main-image");
  if (!img || !activeGallery[index]) return;
  img.src = activeGallery[index];
  document.querySelectorAll(".gallery-thumb").forEach((b, i) => {
    b.classList.toggle("ring-2", i === index);
    b.classList.toggle("ring-[#0057b8]", i === index);
  });
}

/* ====== FIL D'ARIANE ====== */
function breadcrumb(path, last) {
  const parts = path ? path.split("/") : [];
  let html = `<a href="#" class="${path || last ? "text-[#0057b8] hover:underline" : "text-slate-900 font-bold"}">🏠 Accueil</a>`;
  parts.forEach((p, i) => {
    const target = parts.slice(0, i + 1).join("/");
    const isLast = i === parts.length - 1 && !last;
    html += `<span class="text-slate-300">/</span>` + (isLast
      ? `<span class="font-bold text-slate-900">${esc(p)}</span>`
      : `<a href="#${encodeURIComponent(target)}" class="text-[#0057b8] hover:underline">${esc(p)}</a>`);
  });
  if (last) html += `<span class="text-slate-300">/</span><span class="font-bold text-slate-900">${esc(last)}</span>`;
  $("breadcrumb").innerHTML = html;
}

/* ====== ROUTAGE ====== */
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  $("search").value = "";
  if (h === "diagnostic") return renderDiagnostic();
  if (h.startsWith("produit=")) renderProduct(h.slice(8));
  else { breadcrumb(h); renderGrid(children(h)); }
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* Recherche dans toute la gamme (modèle, code EAN, nom de fichier) */
$("search").addEventListener("input", e => {
  const q = norm(e.target.value);
  if (!q) return route();
  const res = tree.filter(i => isDoc(i) && norm(i.path).includes(q));
  $("breadcrumb").innerHTML = `<span class="text-slate-900 font-bold">Résultats pour « ${esc(e.target.value)} »</span>`;
  renderGrid(res, true);
});

/* ====== DÉMARRAGE ====== */
(async () => {
  try {
    await loadTree();
    tree.filter(i => i.type === "blob" && inImages(i.path) && IMG_EXT.includes(ext(i.path)) && i.path !== CONFIG.logo)
        .forEach(i => { photos[norm(base(i.path))] = url(i.path); });
    renderLogo();
    window.addEventListener("hashchange", route);
    route();
  } catch (err) {
    $("loading").classList.add("hidden");
    $("error").classList.remove("hidden");
    $("error").innerHTML = `<b>Impossible de charger la médiathèque</b><br><span class="text-sm">${esc(err.message)}</span>`;
  }
})();
</script>
</body>
</html>
